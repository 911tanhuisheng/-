# 宝塔 / 自建 Nginx 示例（按实际域名、路径修改后使用）
# 伪静态：location / { try_files $uri $uri/ /index.html; }

server
{
    listen 80;
    server_name oj.example.com;
    index index.html index.htm;
    root /var/www/myoj/dist;

    # 后端 API（与前端同机时用 127.0.0.1）
    location /api/ {
        proxy_pass http://127.0.0.1:8888/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.git|node_modules) {
        return 404;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|ico|svg|webp)$ {
        expires 30d;
        access_log off;
    }

    location ~ .*\.(js|css)$ {
        expires 12h;
        access_log off;
    }

    access_log  /var/log/nginx/myoj.access.log;
    error_log   /var/log/nginx/myoj.error.log;
}
